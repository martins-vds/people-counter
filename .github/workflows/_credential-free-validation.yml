name: Credential-free validation

on:
  workflow_call:
    inputs:
      base_sha:
        description: Base commit used to select changed Python and test files
        required: true
        type: string
      head_sha:
        description: Head commit used to select changed Python and test files
        required: true
        type: string

permissions: {}

env:
  BASE_SHA: ${{ inputs.base_sha }}
  HEAD_SHA: ${{ inputs.head_sha }}

jobs:
  python-quality:
    name: Python lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked development environment
        # zizmor: ignore[use-trusted-publishing] Dependency sync, not publishing.
        run: |
          uv sync --frozen --dev \
            --extra cpu \
            --extra experiments \
            --extra export \
            --extra publisher \
            --extra local-spark

      - name: Lint and type-check changed Python
        run: .github/scripts/validate-python-quality.sh

      - name: Upload Python quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/python-quality/
          if-no-files-found: error
          retention-days: 14

  python-tests:
    name: Python tests and CRAP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure FFmpeg media probe
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffprobe -version

      - name: Install locked development environment
        # zizmor: ignore[use-trusted-publishing] Dependency sync, not publishing.
        run: |
          uv sync --frozen --dev \
            --extra cpu \
            --extra experiments \
            --extra export \
            --extra publisher \
            --extra local-spark

      - name: Run test suite with coverage and CRAP evidence
        run: |
          mkdir -p evidence/python-tests
          set -o pipefail
          uv run pytest tests \
            -m "not compose" \
            --crap \
            --junitxml=evidence/python-tests/junit.xml \
            --cov=people_counter \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:evidence/python-tests/coverage.xml \
            --cov-report=json:evidence/python-tests/coverage.json \
            2>&1 | tee evidence/python-tests/pytest-crap.txt

      - name: Upload test and CRAP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/python-tests/
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: Mutation policy for changed tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure FFmpeg media probe
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffprobe -version

      - name: Install locked development environment
        # zizmor: ignore[use-trusted-publishing] Dependency sync, not publishing.
        run: |
          uv sync --frozen --dev \
            --extra cpu \
            --extra experiments \
            --extra export \
            --extra publisher \
            --extra local-spark

      - name: Run changed-test mutation policy
        run: .github/scripts/run-changed-test-mutations.sh

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/mutation/
          if-no-files-found: error
          retention-days: 14

  fabric:
    name: Fabric definitions, PBIP, and TMDL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --frozen --dev

      - name: Validate Fabric source assets
        run: .github/scripts/validate-fabric-assets.sh

      - name: Upload Fabric validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabric-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/fabric/
          if-no-files-found: error
          retention-days: 14

  terraform:
    name: Terraform (${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/bootstrap
          - infra/modules/fabric-foundation
          - infra/environments/dev
          - infra/environments/test
          - infra/environments/prod
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_ROOT: ${{ matrix.root }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir="${TF_ROOT}" fmt -check -recursive -diff

      - name: Initialize without a backend
        run: |
          mkdir -p "evidence/terraform/${TF_ROOT//\//-}"
          set -o pipefail
          terraform -chdir="${TF_ROOT}" init \
            -backend=false -input=false -lockfile=readonly -no-color \
            2>&1 | tee "evidence/terraform/${TF_ROOT//\//-}/init.txt"

      - name: Validate configuration
        run: |
          set -o pipefail
          terraform -chdir="${TF_ROOT}" validate -no-color \
            2>&1 | tee "evidence/terraform/${TF_ROOT//\//-}/validate.txt"

      - name: Run Terraform tests
        run: |
          set -o pipefail
          terraform -chdir="${TF_ROOT}" test -no-color \
            2>&1 | tee "evidence/terraform/${TF_ROOT//\//-}/test.txt"

      - name: Upload Terraform validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/terraform/
          if-no-files-found: error
          retention-days: 14

  workflow-security:
    name: Workflow syntax and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install actionlint
        env:
          ACTIONLINT_COMMIT: 03d0035246f3e81f36aed592ffb4bebf33a03106
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_COMMIT}"

      - name: Validate workflow syntax and embedded shell
        run: |
          mkdir -p evidence/workflows
          set -o pipefail
          "$(go env GOPATH)/bin/actionlint" -color=false \
            2>&1 | tee evidence/workflows/actionlint.txt

      - name: Enforce repository workflow policy
        run: |
          set -o pipefail
          .github/scripts/validate-workflows.sh \
            2>&1 | tee evidence/workflows/policy.txt

      - name: Audit all workflows
        run: |
          set -o pipefail
          uvx --from zizmor==1.14.2 zizmor \
            --persona auditor \
            --offline \
            .github/workflows/ \
            2>&1 | tee evidence/workflows/zizmor.txt

      - name: Upload workflow validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/workflows/
          if-no-files-found: error
          retention-days: 14
