name: Terraform PR plan

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      ref:
        description: Reviewed, same-repository PR head commit
        required: true
        type: string
      pull_request_number:
        required: true
        type: number

permissions: {}

concurrency:
  group: terraform-pr-plan-${{ inputs.environment }}-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # Required only for azure/login's short-lived credential.
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD_AUTH: "true"
      FABRIC_USE_OIDC: "true"
      FABRIC_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      FABRIC_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_capacity_id: ${{ vars.FABRIC_CAPACITY_ID }}
      TF_VAR_workspace_role_assignments: ${{ vars.FABRIC_WORKSPACE_ROLE_ASSIGNMENTS }}
      TF_VAR_enable_activator: ${{ vars.FABRIC_ENABLE_ACTIVATOR || 'false' }}
      TF_VAR_onelake_shortcuts: ${{ vars.FABRIC_ONELAKE_SHORTCUTS || '{}' }}
      TF_VAR_adls_storage_account_resource_id: ${{ vars.FABRIC_ADLS_STORAGE_ACCOUNT_RESOURCE_ID }}
      TF_VAR_adls_shortcuts: ${{ vars.FABRIC_ADLS_SHORTCUTS || '{}' }}
      TF_BACKEND_RESOURCE_GROUP_NAME: ${{ vars.TF_BACKEND_RESOURCE_GROUP_NAME }}
      TF_BACKEND_STORAGE_ACCOUNT_NAME: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT_NAME }}
      TF_BACKEND_CONTAINER_NAME: ${{ vars.TF_BACKEND_CONTAINER_NAME }}
      TF_ENVIRONMENT: ${{ inputs.environment }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_ROOT: ${{ inputs.working_directory }}
      TF_REF: ${{ inputs.ref }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Validate immutable inputs
        run: |
          if [[ ! "${TF_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Plan ref must be a full commit SHA"
            exit 1
          fi
          if [ "${TF_ROOT}" != "infra/environments/${TF_ENVIRONMENT}" ]; then
            echo "::error::Terraform root does not match the protected environment"
            exit 1
          fi
          case "${TF_ENVIRONMENT}" in
            dev|test|prod) ;;
            *)
              echo "::error::Unsupported environment"
              exit 1
              ;;
          esac
          test "$(git rev-parse HEAD)" = "${TF_REF}"

      - name: Log in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Initialize protected backend
        run: |
          terraform -chdir="${TF_ROOT}" init -input=false \
            -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TF_BACKEND_CONTAINER_NAME}" \
            -backend-config="key=people-counter/${TF_ENVIRONMENT}.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Validate configuration
        run: terraform -chdir="${TF_ROOT}" validate

      - name: Create reviewed plan
        id: plan
        run: |
          set +e
          terraform -chdir="${TF_ROOT}" plan \
            -input=false -detailed-exitcode -out=tfplan
          status=$?
          set -e
          case "${status}" in
            0) echo "has_changes=false" >> "${GITHUB_OUTPUT}" ;;
            2) echo "has_changes=true" >> "${GITHUB_OUTPUT}" ;;
            *) exit "${status}" ;;
          esac
          terraform -chdir="${TF_ROOT}" show -json tfplan \
            > "${TF_ROOT}/tfplan.json"

      - name: Produce plan evidence
        env:
          PLAN_HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
        run: |
          jq '{
            format_version,
            terraform_version,
            resource_changes: [
              .resource_changes[]? | {
                address,
                mode,
                type,
                name,
                actions: .change.actions
              }
            ]
          }' "${TF_ROOT}/tfplan.json" > "${TF_ROOT}/tfplan-evidence.json"
          {
            echo "### Reviewed Terraform plan"
            echo
            echo "- PR: #${PR_NUMBER}"
            echo "- Environment: \`${TF_ENVIRONMENT}\`"
            echo "- Commit: \`${TF_REF}\`"
            echo "- Changes: \`${PLAN_HAS_CHANGES}\`"
            echo
            echo "| Action | Count |"
            echo "|---|---:|"
            jq -r '
              [.resource_changes[]?.change.actions | join("/")]
              | group_by(.)
              | map({action: .[0], count: length})
              | .[]
              | "| \(.action) | \(.count) |"
            ' "${TF_ROOT}/tfplan.json"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload reviewed plan and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-pr-${{ inputs.pull_request_number }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/tfplan.json
            ${{ inputs.working_directory }}/tfplan-evidence.json
          if-no-files-found: error
          retention-days: 14
