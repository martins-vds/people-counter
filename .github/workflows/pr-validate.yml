name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-version:
    name: Release version and unused tag
    if: startsWith(github.head_ref, 'releases/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Validate release branch, lockfile, identity, and unused tag
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: bash .github/scripts/validate-release.sh pr "${RELEASE_BRANCH}"

  credential-free:
    name: Credential-free validation
    permissions:
      contents: read
    uses: ./.github/workflows/_credential-free-validation.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
