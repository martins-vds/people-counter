name: Release SDK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the package version (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable tagged source
        id: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Verify package version matches tag
        id: version
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          version=$(uv version --short)
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Build locked CPU SDK bundle
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "${EXPECTED_MACHINE}"
          uv run --locked --no-dev --extra cpu \
            python scripts/build_sdk_bundle.py cpu

      - name: Verify archive and install offline in a clean environment
        env:
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          bundles=(dist/sdk-bundles/*.zip)
          test "${#bundles[@]}" -eq 1
          unzip -t "${bundles[0]}"
          unzip -q "${bundles[0]}" -d "${RUNNER_TEMP}/sdk-bundle"
          wheelhouses=("${RUNNER_TEMP}"/sdk-bundle/*/wheels)
          test "${#wheelhouses[@]}" -eq 1
          smoke="${RUNNER_TEMP}/sdk-smoke"
          uv venv --python 3.12 "${smoke}"
          uv pip install --python "${smoke}/bin/python" \
            --no-index --find-links "${wheelhouses[0]}" \
            "people-counter[cpu]==${SDK_VERSION}"
          uv pip check --python "${smoke}/bin/python"
          "${smoke}/bin/people-counter" --help
          mkdir -p release-assets
          mv "${bundles[0]}" \
            "release-assets/people-counter-${SDK_VERSION}-cpu-linux-${RELEASE_ARCH}-cp312.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-linux-${{ matrix.arch }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-linux-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error

      - name: Verify source, generate checksums and publish
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          remote_commit=$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)
          if [[ "${remote_commit}" != "${SOURCE_COMMIT}" ]]; then
            echo "::error::Release tag moved after the build started"
            exit 1
          fi
          assets=(
            "people-counter-${SDK_VERSION}-cpu-linux-amd64-cp312.zip"
            "people-counter-${SDK_VERSION}-cpu-linux-arm64-cp312.zip"
          )
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "${RELEASE_TAG}" "${assets[@]}" SHA256SUMS \
            --verify-tag --generate-notes --fail-on-no-commits \
            --title "People Counter SDK ${RELEASE_TAG}"
