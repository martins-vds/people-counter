name: Release SDK

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the package version (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.event_name == 'workflow_dispatch' && format('releases/{0}', inputs.tag) || github.event.pull_request.head.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate source and tag merged release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'releases/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the immutable release tag.
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Release tag must be vMAJOR.MINOR.PATCH"
              exit 1
            fi
            if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "::error::Release tag ${RELEASE_TAG} does not exist. Merge a release PR first."
              exit 1
            fi
            commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
            branch="releases/${RELEASE_TAG}"
          else
            commit=$(git rev-parse --verify "${MERGE_COMMIT}^{commit}")
            branch="${RELEASE_BRANCH}"
            RELEASE_TAG="${branch#releases/}"
          fi
          {
            echo "tag=${RELEASE_TAG}"
            echo "commit=${commit}"
            echo "branch=${branch}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Verify package version and immutable tag
        id: version
        env:
          RELEASE_BRANCH: ${{ steps.source.outputs.branch }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash .github/scripts/validate-release.sh release "${RELEASE_BRANCH}" "${SOURCE_COMMIT}"

      - name: Create tag at the merged commit if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${SOURCE_COMMIT}"
          fi

  build:
    name: Build CPU SDK (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Build locked CPU SDK bundle
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "${EXPECTED_MACHINE}"
          uv run --locked --no-dev --extra cpu \
            python scripts/build_sdk_bundle.py cpu

      - name: Verify archive and install offline in a clean environment
        env:
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          bundles=(dist/sdk-bundles/*.zip)
          test "${#bundles[@]}" -eq 1
          unzip -t "${bundles[0]}"
          unzip -q "${bundles[0]}" -d "${RUNNER_TEMP}/sdk-bundle"
          wheelhouses=("${RUNNER_TEMP}"/sdk-bundle/*/wheels)
          test "${#wheelhouses[@]}" -eq 1
          smoke="${RUNNER_TEMP}/sdk-smoke"
          uv venv --python 3.13 "${smoke}"
          uv pip install --python "${smoke}/bin/python" \
            --no-index --find-links "${wheelhouses[0]}" \
            "people-counter[cpu]==${SDK_VERSION}"
          uv pip check --python "${smoke}/bin/python"
          "${smoke}/bin/people-counter" --help
          mkdir -p release-assets
          mv "${bundles[0]}" \
            "release-assets/people-counter-${SDK_VERSION}-cpu-linux-${RELEASE_ARCH}-cp313.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-linux-${{ matrix.arch }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

  models:
    name: Download and archive model weights
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Download all pinned model weights
        run: |
          uv run --locked --no-dev python scripts/download_models.py \
            --pipeline all --output-dir outputs/models

      - name: Archive models without download cache metadata
        working-directory: outputs
        env:
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/release-assets"
          archive="${GITHUB_WORKSPACE}/release-assets/people-counter-${SDK_VERSION}-models.zip"
          zip -r "${archive}" models -x '*/.cache/*'
          unzip -t "${archive}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-models
          path: release-assets/*-models.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish complete SDK release
    needs: [prepare, build, models]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # Upload release assets and publish the draft.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error

      - name: Verify source, generate checksums and publish
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/publish-sdk-release.sh"
