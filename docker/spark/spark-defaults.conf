spark.master                             spark://spark-master:7077
spark.submit.deployMode                  client
spark.driver.bindAddress                 0.0.0.0
spark.driver.port                       39000
spark.blockManager.port                 39001
spark.ui.port                           4040
spark.executor.instances                2
spark.cores.max                         2
spark.executor.cores                    1
spark.executor.memory                   1g
spark.dynamicAllocation.enabled         false
spark.python.worker.reuse               true
spark.pyspark.python                    /opt/people-counter/.venv/bin/python
spark.pyspark.driver.python             /opt/people-counter/.venv/bin/python
spark.eventLog.enabled                  true
spark.eventLog.dir                      file:///data/output/spark-events
spark.eventLog.compress                 true
spark.history.fs.logDirectory           file:///data/output/spark-events
spark.history.fs.cleaner.enabled        false
spark.sql.extensions                    io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog         org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.shuffle.partitions            2
spark.default.parallelism               2
spark.network.timeout                   120s
spark.executor.heartbeatInterval        10s
