[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "people-counter"
version = "0.1.0"
description = "A permissively licensed CPU/GPU distinct person counter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

# Permissive, production-ready computer vision dependencies
dependencies = [
    "transformers>=5.1.0,<6",         # Apache 2.0 (RT-DETR/RF-DETR engines)
    "huggingface-hub>=0.34.0",         # Apache 2.0 (Pinned model download)
    "opencv-python>=4.11.0.86",        # Apache 2.0
    "numpy>=1.24.0",                   # BSD
    "scipy>=1.10.0",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pytest-cov>=7.1.0",
    "pytest-crap>=0.3.0",
]

[project.scripts]
people-counter = "people_counter.cli:main"
people-counter-rtdetr = "people_counter.cli:rtdetr_osnet_main"
people-counter-rfdetr = "people_counter.cli:rfdetr_botsort_main"
people-counter-publish-manifests = "people_counter.manifest_publisher:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["people_counter*"]

[tool.setuptools.package-data]
people_counter = ["py.typed"]

[tool.mutmut]
source_paths = ["src/people_counter/"]
pytest_add_cli_args_test_selection = ["tests/"]

[project.optional-dependencies]
cpu = [
    "libreyolo==1.5.0",
    "rfdetr==1.10.1",
    "supervision==0.30.3",
    "trackers",
    "torch",
    "torchvision",
]
gpu = [
    "libreyolo==1.5.0",
    "rfdetr==1.10.1",
    "supervision==0.30.3",
    "trackers",
    "torch",
    "torchvision",
]
experiments = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.4.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
]
publisher = [
    "azure-identity>=1.17.0,<2",
    "azure-storage-file-datalake>=12.16.0,<13",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
trackers = { git = "https://github.com/roboflow/trackers", rev = "3fb83d1618f29b7fdd4617757b6894e4ec71146d" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
