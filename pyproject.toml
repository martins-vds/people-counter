[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "people-counter"
version = "0.9.59"
description = "A permissively licensed CPU/GPU distinct person counter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

# Permissive, production-ready computer vision dependencies
dependencies = [
    "transformers>=5.1.0,<6",         # Apache 2.0 (RT-DETR/RF-DETR engines)
    "huggingface-hub>=0.34.0",         # Apache 2.0 (Pinned model download)
    "opencv-python>=4.11.0.86",        # Apache 2.0
    "numpy>=1.24.0,<2.5",              # BSD; Fabric Runtime 2.0 pool uses 2.4.x
    "scipy>=1.10.0",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pytest-cov>=7.1.0",
    "pytest-crap>=0.3.0",
]

[project.scripts]
people-counter = "people_counter.cli:main"
people-counter-rtdetr = "people_counter.cli:rtdetr_osnet_main"
people-counter-rfdetr = "people_counter.cli:rfdetr_botsort_main"
people-counter-local = "people_counter.local_cli:main"
pc-control-sjd = "people_counter.sjd_control:main"
pc-process-sjd = "people_counter.sjd_process:main"
pc-gold-sjd = "people_counter.sjd_gold:main"
pc-local-orchestrate = "people_counter.sjd_orchestrate:main"
pc-benchmark-control-sjd = "people_counter.fabric_benchmark_jobs:control_main"
pc-benchmark-process-sjd = "people_counter.fabric_benchmark_jobs:process_main"
pc-benchmark-gold-sjd = "people_counter.fabric_benchmark_jobs:gold_main"
pc-production-control-sjd = "people_counter.fabric_sjd_jobs:control_main"
pc-production-dispatcher-sjd = "people_counter.fabric_sjd_jobs:dispatcher_main"
pc-production-process-sjd = "people_counter.fabric_sjd_jobs:process_main"
pc-production-reconciliation-sjd = "people_counter.fabric_sjd_jobs:reconciliation_main"
pc-production-gold-sjd = "people_counter.fabric_sjd_jobs:gold_main"
pc-production-refresh-sjd = "people_counter.fabric_sjd_jobs:refresh_main"
pc-production-schema-cutover = "people_counter.fabric_sjd_cutover_jobs:main"
prepare-manifests = "people_counter.manifest_publisher:prepare_main"
publish-manifests = "people_counter.manifest_publisher:publish_main"
pc-reconcile-fabric-runtime = "people_counter.fabric_reconcilers:main"
pc-validate-fabric-deployment = "people_counter.fabric_acceptance:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["people_counter*"]

[tool.setuptools.package-data]
people_counter = ["py.typed", "data/*.json", "data/deploy/*.json"]

[tool.mutmut]
source_paths = [
    "src/people_counter/",
    "scripts/deploy_sjd_analytics.py",
    "scripts/deploy_sjd_operations.py",
    "scripts/deploy_sjd_operational_report.py",
    "scripts/check_fabric_definition_drift.py",
    "scripts/validate_fabric_deployment.py",
    "scripts/download_models.py",
]
pytest_add_cli_args = ["-o", "pythonpath=src"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [
    "fabric/",
    "notebooks/fabric/",
    "notebooks/customer_end_to_end_demo.ipynb",
    "samples/",
    "scripts/",
    "src/people_counter/data/sjd_release_identity.json",
    "src/people_counter/data/deploy/dev.json",
    "src/people_counter/data/deploy/test.json",
    "src/people_counter/data/deploy/prod.json",
]
on_dependency_change = "rerun"

[project.optional-dependencies]
cpu = [
    "libreyolo==1.5.0",
    "rfdetr==1.10.1",
    "supervision==0.30.3",
    "trackers==2.6.0",
    "torch",
    "torchvision",
]
gpu = [
    "libreyolo==1.5.0",
    "rfdetr==1.10.1",
    "supervision==0.30.3",
    "trackers==2.6.0",
    "torch",
    "torchvision",
]
experiments = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.4.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
]
demo = [
    "deltalake>=1,<2",
    "duckdb>=1.5.6,<2",
    "pyarrow>=18",
    "pytz>=2024.1",
]
export = [
    "libreyolo==1.5.0",
    "openvino>=2025.0,<2027",
    "rfdetr[onnx]==1.10.1",
]
publisher = [
    "azure-identity>=1.17.0,<2",
    "azure-storage-file-datalake>=12.16.0,<13",
]
local-spark = [
    "delta-spark==4.2.0",
    "pyspark==4.1.1",
]

[tool.pytest.ini_options]
markers = [
    "compose: requires the local Docker Compose Spark cluster",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
