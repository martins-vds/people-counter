[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permissive-object-counter"
version = "0.1.0"
description = "A permissively licensed CPU/GPU distinct person counter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Permissive, production-ready computer vision dependencies
dependencies = [
    "transformers>=4.40.0",           # Apache 2.0 (RT-DETR Model Engine)
    "huggingface-hub>=0.34.0",         # Apache 2.0 (Pinned model download)
    "opencv-python>=4.11.0.86",        # Apache 2.0
    "numpy>=1.24.0",                   # BSD
    "scipy>=1.10.0"                    # BSD
]

[project.optional-dependencies]
cpu = [
    "libreyolo==1.5.0",
    "torch",
    "torchvision",
]
gpu = [
    "libreyolo==1.5.0",
    "torch",
    "torchvision",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
